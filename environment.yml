name: tactivs

channels:
  - conda-forge

dependencies:
  - python=3.10
  - numpy=1.26.4
  - pandas=2.3.3
  - rdkit=2022.03.5
  - scikit-learn
  - scipy
  - tqdm
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - --find-links https://data.pyg.org/whl/torch-2.7.1+cu128.html
      - torch==2.7.1+cu128
      - torch-geometric==2.5.2
      - torch-scatter==2.1.2+pt27cu128
