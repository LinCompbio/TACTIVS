[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tactivs"
version = "0.1.0"
description = "Reference-only transductive molecular library ranking"
readme = "README.md"
license = {file = "LICENSE"}
keywords = ["virtual-screening", "molecular-embeddings", "transductive-inference"]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "rdkit>=2022.3",
  "scikit-learn>=1.2",
  "torch>=2.1",
]

[project.scripts]
tactivs-infer = "tactivs.cli:infer_main"
tactivs-build-reference-pool = "tactivs.cli:build_reference_pool_main"
tactivs-build-cache = "tactivs.cli:build_cache_main"
tactivs-fit-whitener = "tactivs.cli:fit_whitener_main"
tactivs-benchmark = "tactivs.benchmark:main"

[project.optional-dependencies]
ept = [
  "scipy>=1.10",
  "torch-geometric>=2.5",
  "torch-scatter>=2.1",
  "tqdm>=4.60",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tactivs._vendor.ept" = ["LICENSE"]
